# Fallback trigger for the Cloudflare build.
#
# The site is served by Cloudflare Pages, which builds from main on its own:
# a push to main is already a deploy, and the cron Worker in cloudflare/ starts
# the daily rebuild at 05:17 UTC. Neither needs GitHub Actions, which cannot run
# while the account is billing-locked.
#
# This workflow exists only as a way to start a Cloudflare build by hand if the
# Worker is ever broken and you are not at a machine with the repo checked out.
# It runs on request, never on a push: an automatic run here would race the
# build Cloudflare has already started for the same commit.
#
# Needs a DEPLOY_HOOK repository secret holding the Pages deploy hook URL, the
# same value that is in .env locally.
#
# This used to deploy to GitHub Pages. It does not any more — the domain was cut
# over to Cloudflare and gh-pages is not what visitors see.
name: Trigger a Cloudflare build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the Pages build
        env:
          DEPLOY_HOOK: ${{ secrets.DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "No DEPLOY_HOOK secret set. Add it in Settings → Secrets → Actions."
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null
          echo "Triggered. Watch it land:"
          echo "  curl -s https://glasgowtheatre.com/data/status.json"
