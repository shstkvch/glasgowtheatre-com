<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theatre 118 — a little closer to the action</title>
  <link rel="stylesheet" href="ad.css">
  <script src="ad.js" defer></script>
</head>
<body>
  <aside class="ad" aria-label="Advertisement for Theatre 118">
    <div class="stage" aria-hidden="true">
      <img class="performance" src="assets/performance.webp" alt="" width="1000" height="667">
      <div class="photo-wash"></div>
      <div class="spotlight"></div>
      <div class="stage-caption">REAL PEOPLE. RIGHT THERE.</div>
    </div>
    <div class="orange-panel" aria-hidden="true"></div>
    <header class="identity">
      <img class="logo" src="assets/logo.png" alt="Theatre 118" width="82" height="82">
      <div class="location">GLASGOW’S FRINGE THEATRE<span>24 PAYNE STREET · PORT DUNDAS</span></div>
    </header>
    <div class="message" aria-live="off">
      <h1><span class="line-one">SMALL STAGE.</span><span class="line-two">BIG FEELINGS.</span></h1>
      <p class="tagline">Go on. Feel something in person.</p>
    </div>
    <div class="scene-picker" role="group" aria-label="Choose a scene">
      <span class="picker-label">PICK YOUR SCENE</span>
      <button type="button" data-scene="0" aria-pressed="true">Theatre</button>
      <button type="button" data-scene="1" aria-pressed="false">Comedy</button>
      <button type="button" data-scene="2" aria-pressed="false">Live</button>
    </div>
    <div class="booking">
      <span class="price-note">Pay What You Can tickets available</span>
      <a class="ticket" href="https://theatre118.com/whats-on" target="_blank" rel="noopener sponsored"><span>SEE WHAT’S ON</span><span class="arrow" aria-hidden="true">↗</span></a>
    </div>
    <button class="motion" type="button" aria-label="Pause animation" aria-pressed="false"><span class="pause-icon" aria-hidden="true">Ⅱ</span></button>
    <div class="curtain curtain-left" aria-hidden="true"><span>THEATRE</span></div>
    <div class="curtain curtain-right" aria-hidden="true"><span>118</span></div>
  </aside>
</body>
</html>
